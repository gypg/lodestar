name: quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    # Service container: a real PostgreSQL the migration tests talk to.
    # Migrations must work on PostgreSQL (production DB), but SQLite-only
    # tests can't catch reserved-word quoting bugs. CI spins up this service
    # so the opt-in TestPostgres* tests actually run.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lodestar_migrate_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres -d lodestar_migrate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure static/out exists
        run: mkdir -p static/out && touch static/out/.keep

      - name: Go compile check
        run: go test -run=TestNoSuchTest ./...

      - name: Go test
        # -count=1 disables the test result cache. Without it a run can report
        # green from cached results for packages whose inputs look unchanged,
        # which has already masked a regression during verification once.
        run: go test ./... -count=1

      - name: Migration tests on PostgreSQL
        # Migrations must be cross-dialect: SQLite tests can't catch reserved-
        # word quoting bugs (e.g. `key` = ? is a syntax error on PG). Run the
        # opt-in postgres integration tests against the service container so
        # the class of bug that previously blocked production boot is caught.
        env:
          LODESTAR_TEST_POSTGRES_DSN: "host=127.0.0.1 user=postgres password=postgres dbname=lodestar_migrate_test port=5432 sslmode=disable"
        run: go test ./internal/db/migrate/... -count=1 -run TestPostgres

  race:
    name: race detector
    runs-on: ubuntu-latest
    # The race detector needs cgo + a C toolchain, which the Windows dev machine
    # does not have, so this is the only place concurrency bugs get an automated
    # check. Several past fixes (relay log ordering, the key-retry spin) had to be
    # verified by observing corrupted output instead, because nothing ran -race.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure static/out exists
        run: mkdir -p static/out && touch static/out/.keep

      - name: Go test with race detector
        env:
          CGO_ENABLED: 1
        # Timeout raised above the 10m default: -race instrumentation slows the
        # suite down substantially.
        run: go test ./... -count=1 -race -timeout 25m

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      # `next build` does NOT type-check (typescript.ignoreBuildErrors is on so
      # the static export can't be blocked by types), so a green build is not
      # type evidence. 18 type errors once rode to production this way —
      # including a missing useTranslations() that white-screened a dialog.
      # This step is the only thing that catches that class of bug.
      - name: TypeScript
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:i18n && pnpm test:unit

      # CJK 回归门：扫描 web/src 下中文硬编码，与 tests/cjk-baseline.json 对比。
      # 防止新增中文 UI 文案绕过 i18n 直接写进组件。allowlist 文件见 tests/cjk-allowlist.json。
      # 新文件/非 allowlist 文件 count 增加 → FAIL；allowlist 文件增加 → WARN。
      # 基线 196/19/0（2026-08-15）。详情见 web/tests/cjk-scan.cjs 头注释。
      - name: CJK regression gate
        run: pnpm test:cjk

      - name: Static build
        env:
          NEXT_PUBLIC_APP_VERSION: ci
        run: pnpm build