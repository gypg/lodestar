# =============================================================================
# Lodestar 生产部署（PostgreSQL + Redis 全栈）
#
# 复用服务器现有基础设施（与旧 newapi 同款）：
#   - PostgreSQL @ YOUR_DB_HOST:5432 → 为 Lodestar 新建独立库 `lodestar` + 独立角色（新鲜密码）
#   - Redis      @ YOUR_DB_HOST:6379 → 用独立 db 索引（旧 newapi 用 /1，Lodestar 用 /2）
#
# 镜像由 CI 构建并推到 GHCR（.github/workflows/docker.yml，quality 全绿后才推），
# 服务器侧不 build——直接 pull。所有密钥走 .env（不入 git）。
# 用法：cp .env.example .env && 填值 → ./scripts/deploy.sh
# 更新：./scripts/deploy.sh              （拉 .env 里 LODESTAR_IMAGE_TAG 指定的版本，默认 latest）
# 回滚：./scripts/deploy.sh sha-<commit> （或改 .env 的 LODESTAR_IMAGE_TAG 后重跑）
# 详见 docs/DEPLOY.md「生产全栈」。
# =============================================================================
services:
  lodestar:
    # CI 构建的多阶段镜像（非 root + healthcheck + 前端嵌入二进制）。
    # 弱服务器无需 build，pull 即用。
    # tag 由 .env 的 LODESTAR_IMAGE_TAG 控制（缺省 latest）：钉 sha-<commit> 即可回滚到任意版本。
    # 不要把 tag 硬编码在这里——那样每次升级都要改入 git 的文件，且极易忘记而长期跑旧镜像。
    image: ghcr.io/gypg/lodestar:${LODESTAR_IMAGE_TAG:-latest}
    container_name: lodestar
    restart: unless-stopped
    # 用 always：配合浮动 tag(latest)，确保 up -d 时总是取回 registry 上的最新 digest。
    # missing 会在本地已有同名 tag 时跳过拉取，导致「pull 了也不更新」。
    pull_policy: always
    ports:
      - "${LODESTAR_HOST_PORT:-8081}:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # 容器时区；海外部署可改为显式 IANA 时区名，例如 America/Los_Angeles
      TZ: "Asia/Shanghai"
    # PG/Redis 为外部服务（YOUR_DB_HOST），无 depends_on。
    # 容器需能路由到 YOUR_DB_HOST——旧 newapi 容器在同主机已验证可达，Lodestar 同法部署即可。
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/bootstrap/status"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # ---- B-12 容器安全加固 ----
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp

